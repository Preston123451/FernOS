---
unpack:
    -   source: "/run/archiso/bootmnt/fernos/x86_64/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""
    # mkarchiso empties /boot inside the squashfs; the kernel comes from the ISO.
    -   source: "/run/archiso/bootmnt/fernos/boot/x86_64/vmlinuz-linux-cachyos"
        sourcefs: "file"
        destination: "/boot/vmlinuz-linux-cachyos"
