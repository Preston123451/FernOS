# FernOS installer (Calamares), LIVE ISO ONLY.
# Offline install: the live system's squashfs is copied to disk, so the
# installed system has exactly the apps and settings of the live ISO, and no
# internet connection is needed. Live-only files are removed by
# shellprocess@cleanup (see modules/shellprocess_cleanup.conf).
---
modules-search: [ local ]

instances:
- id:       cleanup
  module:   shellprocess
  config:   shellprocess_cleanup.conf
- id:       final
  module:   shellprocess
  config:   shellprocess_final.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - shellprocess@cleanup
  - luksbootkeyfile
  - initcpiocfg
  - initcpio
  - removeuser
  - users
  - networkcfg
  - displaymanager
  - hwclock
  - grubcfg
  - bootloader
  - services-systemd
  - shellprocess@final
  - umount
- show:
  - finished

branding: fernos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
