---
defaultGroups:
    - wheel
    - users
    - audio
    - video
    - storage
    - network
    - lp
    - sys
    - rfkill
    - name: gamemode
      must_exist: false
      system: true
doAutologin:     false
sudoersGroup:    wheel
setRootPassword: true
doReusePassword: true
passwordRequirements:
    minLength: 1
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
  shell: /usr/bin/fish
  forbidden_names: [ root, fern ]
  home_permissions: "o700"
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "fernos-${cpu}"
  forbidden_names: [ localhost ]
