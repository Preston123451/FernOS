# Runs inside the installed system right after the live squashfs is copied.
# Removes everything that only makes sense on the live ISO.
---
i18n:
    name: "Preparing FernOS"
dontChroot: false
timeout: 900
script:
    # Live-only privileges and autologin
    - "-rm -f /etc/sudoers.d/10-fernos-live"
    - "-rm -f /etc/polkit-1/rules.d/49-fernos-live.rules"
    - "-rm -f /etc/sddm.conf.d/10-fernos.conf"
    - "-rm -rf /etc/systemd/system/getty@tty1.service.d"
    # archiso boot hooks and live services
    - "-rm -f /etc/mkinitcpio.conf.d/archiso.conf"
    - "-rm -f /etc/systemd/system/etc-pacman.d-gnupg.mount /etc/systemd/system/pacman-init.service /etc/systemd/system/choose-mirror.service /etc/systemd/system/livecd-alsa-unmuter.service /etc/systemd/system/livecd-talk.service"
    - "-find /etc/systemd/system -xtype l -delete"
    - "-rm -f /etc/systemd/journald.conf.d/volatile-storage.conf /etc/systemd/logind.conf.d/do-not-suspend.conf /etc/systemd/resolved.conf.d/archiso.conf"
    - "-rm -f /etc/systemd/network/20-ethernet.network /etc/systemd/network/20-wlan.network /etc/systemd/network/20-wwan.network /etc/systemd/networkd.conf.d/ipv6-privacy-extensions.conf"
    - "-rm -f /etc/ssh/sshd_config.d/10-archiso.conf"
    # Live session skeleton tweaks (no screen lock, no wallet prompt)
    - "-rm -f /etc/skel/.config/kscreenlockerrc /etc/skel/.config/kwalletrc"
    - "-rm -rf /etc/skel/Desktop"
    - "-rm -f /root/.automated_script.sh /root/.zlogin /etc/motd"
    - "-rm -f /usr/local/bin/choose-mirror /usr/local/bin/Installation_guide /usr/local/bin/livecd-sound /usr/local/bin/fernos-install"
    - "-rm -rf /usr/local/share/livecd-sound /usr/local/share/applications/fernos-install.desktop"
    # The live keyring lives on a tmpfs, so the copied system has none.
    - "pacman-key --init"
    - "pacman-key --populate"
    # The installer itself and archiso tooling are not needed afterwards.
    - "-pacman -Rns --noconfirm cachyos-calamares mkinitcpio-archiso"
