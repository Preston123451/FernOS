LABEL arch
TEXT HELP
Start the FernOS live desktop on BIOS.
Try FernOS without changing anything on this computer.
ENDTEXT
MENU LABEL FernOS live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

# Fallback for graphics cards that show a black screen
LABEL fernsafe
TEXT HELP
Start FernOS with basic graphics (nomodeset).
Use this if the normal entry shows a black or garbled screen.
ENDTEXT
MENU LABEL FernOS live (%ARCH%, BIOS) - safe ^graphics
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset %KERNEL_PARAMS%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Start FernOS on BIOS with the speakup screen reader.
Provides speech feedback on the console.
ENDTEXT
MENU LABEL FernOS live (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
